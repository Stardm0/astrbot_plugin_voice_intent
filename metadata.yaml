name: astrbot_plugin_voice_intent
display_name: 开口吧
author: dafeiyu-tools
version: 1.0.0
desc: 随口一句「用语音跟我说」「念给我听」「别打字了」就开口，不用记指令也不用指定工具；也能 /开口 发 <内容> 直接手动念一句。插件判断这一轮想不想听语音，命中就把回复换成一条语音，没命中一个字都不动；不注册 LLM 工具、不会有「工具没接上」，也不另起 TTS 引擎，直接复用 AstrBot 已配好的文字转语音提供商（复刻音色、语速都保留）。生成前会告知模型这一轮是说出来的，下一轮补一条回执，AI 不会以为自己刚才打了字。支持只这一句或接下来都用语音，说「还是打字吧」随时改回；/开口 校验 可逐条核对全部指令。
repo: 无
astrbot_version: ">=4.5.7"
